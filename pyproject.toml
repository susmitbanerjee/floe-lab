[project]
name = "floe-lab"
version = "0.0.0"
description = "Test bench for Floe: storage, catalog, data with known answers, and benchmarks."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = "==3.14.*"
dependencies = []

[dependency-groups]
dev = [
  "mypy>=2.4.1",
  "pre-commit>=4.7.0",
  "pytest>=9.2.0",
  "ruff>=0.17.6",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["datagen/src/datagen", "checks/src/checks"]

[tool.uv]
required-version = "==0.13.9"

[tool.ruff]
line-length = 100
src = ["datagen/src", "checks/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "PT"]

[tool.ruff.lint.per-file-ignores]
# pytest uses bare asserts.
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["datagen/src", "checks/src", "tests"]
mypy_path = ["datagen/src", "checks/src"]
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra", "--import-mode=importlib"]
markers = ["stack: needs the Compose stack running (make up)"]
